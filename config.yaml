# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # id/COMPAS's-own-score dropped as before, plus the three columns week 3's multicollinearity
  # check found redundant (see src/data_diagnostics.py + the EDA notebook's VIF walkthrough)
  drop_columns: ["id", "decile_score", "score_text", "prior_offenses", "age_in_months", "juvenile_total"]

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"   # one of metrics: what tuning maximises and runs are ranked by
  n_jobs: 1  

# New this week (see Practical/W3/notebooks/01_eda_introduction.ipynb): what src/data_diagnostics.py
# and src/preprocessing.py need to stay generic instead of hardcoding COMPAS's column names.
diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (see the EDA notebook's correlation heatmap + VIF section) --
  # also listed in data.drop_columns above; kept here too so preprocessing.py doesn't need
  # to reach into the data: section to know what to drop
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# New this week (see Practical/W3/notebooks/02_preprocessing.ipynb): this week's diagnosis-driven,
# leak-safe preprocessing recipe. encoder/scaler chosen by hand
preprocessing:
  encoder: "target"      # winner of the 4x4 empirical grid (onehot/ordinal/count/target x none/standard/minmax/robust),
  scaler: "robust"     # scored on accuracy across 15 repeated splits -- see 02_preprocessing.ipynb's grid + paired check
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count","priors_per_adult_year", "has_juvenile_record", "juv_felony_share"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"   # applies to sex, age_cat, c_charge_degree

model:
  type: "hist_gradient_boosting"
  params: {random_state: 42}
  #random_state: 42
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight).
  # logistic_regression:    {max_iter: 2000}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # hist_gradient_boosting: {random_state: 42}

tuning:
  enabled: true
  n_trials: 30         
  n_splits: 5
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 1.0e-6, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 1.0e-12, high: 1.0, log: true}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
