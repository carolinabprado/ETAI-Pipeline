# Week 9 ("Beyond COMPAS", option A): the same pipeline on the Adult income data.
# Run with:  python main.py config_adult.yaml
# Only the data-specific sections differ from config.yaml; CV, models and search spaces are the same.

data:
  path: "data/adult_train.csv"
  target: "income_over_50k"
  sensitive_attr: "sex"           # audited in the fairness report, never a feature
  # id: identifier. fnlwgt: census sampling weight, not a trait of the person. education: the
  # same as education_num, one to one. race: the second sensitive attribute, kept out of the model too.
  drop_columns: ["id", "fnlwgt", "education", "race"]
  # no benchmark_score: Adult has no existing score to compare with

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"   # one of metrics: what tuning maximises and runs are ranked by
  n_jobs: 1  

diagnostics:
  id_column: "id"
  numeric_text_columns: []        # every numeric column already loads as a number
  # "?" means unknown (workclass, occupation, native_country); empty cells in v01-v06 already load as NaN
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  # Adult's own rules: no violations in these files, but they protect future data.
  # 17-year-olds are valid here (74 people), so not COMPAS's {min: 18}.
  # capital_gain = 99999 is the census top code, a real value: not made missing.
  validity_rules:
    age: {min: 17, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}
    capital_loss: {min: 0}
  canonical_categories: {}        # no spelling variants in Adult
  redundant_columns: []           # education is dropped through data.drop_columns

preprocessing:
  encoder: "target"      # one column per feature, so native_country's 41 values don't become ~40 one-hot columns
  scaler: "robust"
  numeric_features: ["age", "education_num", "capital_gain", "capital_loss", "hours_per_week",
                     "v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09",
                     "v10", "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18"]
  categorical_features: ["workclass", "marital_status", "occupation", "relationship", "native_country",
                         "v19", "v20", "v21", "v22", "v23", "v24", "v25"]
  # the people with workclass/occupation "?" earn > 50K about half as often (12% vs 25%):
  # the gap carries information, so it gets a flag as well as an imputed value
  mnar_indicator_sources: ["workclass", "occupation"]
  engineered_features: false     # add_engineered_features() is COMPAS-only
  random_state: 42                  # target encoder's folds and (week 10) the model-based imputers
  imputation:                       # week 10: numeric columns are scaled first, then imputed
    numeric_strategy: "median"      # median | mean | knn | iterative | random_forest
    categorical_strategy: "most_frequent"
    n_neighbors: 5                  # knn
    max_iter: 10                    # iterative, random_forest
    n_estimators: 50                # random_forest (trees per column)

model:
  type: "xgboost"
  params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}
  #random_state: 42
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight).
  # logistic_regression:    {max_iter: 2000}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # hist_gradient_boosting: {random_state: 42}
  # xgboost:                {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}

# Week 8: learned step between preprocessing and the model: keeps the features that at least
# min_votes of three models (random forest, gradient boosting, L1 logistic regression) choose.
feature_selection:
  enabled: true    # week 9: keeps 8 of 37 features, drops every v column (see README "Beyond COMPAS")
  min_votes: 2                                      # 1 (keep almost all) .. 3 (keep only unanimous)
  random_state: 42
  search_space:                                     # tuned together with the model when tuning is on
    select__min_votes: {type: int, low: 1, high: 3}

tuning:
  enabled: true
  n_trials: 30         
  n_splits: 5
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 1.0e-6, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 1.0e-12, high: 1.0, log: true}
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results_adult"   # own folder, so the scoreboard doesn't mix COMPAS and Adult runs
  scoreboard: "results_adult/runs.csv"

# week 9: after the final refit, predict the new people (same cleaning, no de-duplication, every row kept)
predict:
  path: "data/adult_new.csv"
  output: "predictions/adult_new_predictions.csv"
  threshold: 0.5
